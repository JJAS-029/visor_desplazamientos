<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="logo_koala.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico de Riesgos - Desplazamiento Forzado</title>
    
    <!-- 1. Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Estilos de la leyenda flotante */
        .leyenda {
            background: white; 
            padding: 15px; 
            line-height: 1.6;
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 14px;
            color: #333;
        }
        .leyenda h4 { margin: 0 0 10px 0; font-size: 15px; color: #111; }
        .leyenda i {
            width: 18px; 
            height: 18px; 
            float: left;
            margin-right: 8px; 
            opacity: 0.85;
            border: 1px solid rgba(0,0,0,0.2);
        }
        /* Ajuste para el popup */
        .leaflet-popup-content { font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- 2. Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 3. Librerías de Esri para Leaflet (Requeridas para el mapa base ArcGIS) -->
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-vector@4.1.0/dist/esri-leaflet-vector.js"></script>
    
    <script>
        // Inicializar el mapa centrado en el Estado de México (Toluca aprox)
        var map = L.map('map').setView([19.32, -99.65], 9);

        // Tu API Key de ArcGIS
        const llaveEsri = "AAPTa8q9jVjx5yp9dWDmt4yON9Q..LuVerHfjba0cWJIHGg_nNNACso7kRNpVFovApP9NrQOMagkhYy8Z2arUVa-3l4q9uLEotqfSEEdoMCyrK_7iyEV_UUoIuwjFO2-XDNOuM8q9vw7XfSjhTokEYEQwFCONc_PFS3fImFwbFvAHAot4eZQJATJNCGowJeVor5AxCxUyZnwDz463W74IpQ5OTFRvraU58a7NEOZc_p6CSrVxW4AmXhQ0jqKonEpdGQ1nvUa-cBdSUbSHG4I.AT1_FDeLxvxn";

        // Agregar el mapa base vectorial de ArcGIS (Estilo Topográfico)
        L.esri.Vector.vectorBasemapLayer("ArcGIS:ChartedTerritory", {
            apikey: llaveEsri,
            pane: 'tilePane' // Escudo WebGL activado
        }).addTo(map);

        // Función de colores para el semáforo de riesgo
        function getColor(nivel) {
            return nivel === 'Prioritario' ? '#800026' :
                   nivel === 'Alto'        ? '#E31A1C' :
                   nivel === 'Medio'       ? '#FD8D3C' :
                   nivel === 'Bajo'        ? '#FED976' :
                                             '#CCCCCC'; 
        }

        // Estilo de los polígonos municipales
        function styleCoropleta(feature) {
            return {
                fillColor: getColor(feature.properties.NIVEL_ALERTA),
                weight: 1.5,
                opacity: 1,
                color: '#ffffff', // Borde blanco para separar los municipios
                fillOpacity: 0.75
            };
        }

        // Cargar el archivo GeoJSON
        fetch('municipios_riesgo.geojson')
            .then(response => response.json())
            .then(data => {
                
                // CAPA 1: Polígonos de Riesgo Predictivo
                var capaRiesgo = L.geoJson(data, {
                    style: styleCoropleta,
                    onEachFeature: function (feature, layer) {
                        // Verificamos si existe el score para no mostrar error
                        var score = feature.properties.RIESGO_PREDICTIVO ? feature.properties.RIESGO_PREDICTIVO.toFixed(2) : "N/D";
                        
                        layer.bindPopup(
                            "<div style='text-align:center;'>" +
                            "<h3 style='margin:0 0 5px 0; color:#333;'>" + feature.properties.NOM_MUN + "</h3>" +
                            "Nivel de Alerta: <b>" + feature.properties.NIVEL_ALERTA + "</b><br>" +
                            "Score Predictivo: " + score +
                            "</div>"
                        );
                    }
                }).addTo(map);

                // CAPA 2: Puntos de Casos Reales
                var capaCasos = L.layerGroup().addTo(map);
                
                // Extraemos el centro de cada municipio para poner el círculo
                capaRiesgo.eachLayer(function(layer) {
                    var casos = layer.feature.properties.CASOS_REALES_DESPLAZAMIENTO;
                    if (casos > 0) {
                        var centroide = layer.getBounds().getCenter();
                        var circulo = L.circleMarker(centroide, {
                            radius: (casos * 1.5) + 4, // Fórmula para que resalten a distintos tamaños
                            fillColor: "#0055ff", // Azul rey
                            color: "#ffffff", 
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).bindPopup(
                            "<div style='text-align:center;'>" +
                            "<b>" + layer.feature.properties.NOM_MUN + "</b><br>" +
                            "<span style='font-size:16px; color:#0055ff;'><b>" + casos + "</b> Reportes vinculados a desplazamientos</span>" +
                            "</div>"
                        );
                        capaCasos.addLayer(circulo);
                    }
                });

                // Control de Capas interactivo (Arriba a la derecha)
                var controles = {
                    "🔴 Nivel de Riesgo (Polígonos)": capaRiesgo,
                    "🔵 Casos Reales (Círculos)": capaCasos
                };
                L.control.layers(null, controles, {collapsed: false}).addTo(map);
            })
            .catch(error => console.error("Error al cargar el GeoJSON:", error));

        // Construcción de la Leyenda estática (Abajo a la derecha)
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'leyenda'),
                niveles = ['Prioritario', 'Alto', 'Medio', 'Bajo']; // Orden invertido para que el rojo quede arriba
            
            div.innerHTML = '<h4>Riesgo Predictivo</h4>';
            for (var i = 0; i < niveles.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(niveles[i]) + '"></i> ' +
                    niveles[i] + '<br>';
            }
            
            div.innerHTML += '<hr style="margin:10px 0; border:0; border-top:1px solid #ccc;">';
            div.innerHTML += '<i style="background:#0055ff; border-radius:50%; height:14px; width:14px; margin-top:2px;"></i> Casos Reales';
            
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
