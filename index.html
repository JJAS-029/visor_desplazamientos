<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Geográfico de Riesgos - Desplazamiento Forzado</title>
    
    <link rel="icon" href="logo_koala.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .panel-escenarios {
            position: absolute; top: 20px; left: 50px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .panel-escenarios select {
            padding: 8px; font-size: 14px; border-radius: 4px;
            border: 1px solid #ccc; width: 100%; margin-top: 5px;
        }

        .leyenda {
            background: white; padding: 15px; line-height: 1.6;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 14px; color: #333;
        }
        .leyenda h4 { margin: 0 0 10px 0; font-size: 15px; color: #111; }
        .leyenda i {
            width: 18px; height: 18px; float: left;
            margin-right: 8px; opacity: 0.85; border: 1px solid rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="panel-escenarios">
        <b>Selecciona el Modelo Predictivo:</b><br>
        <select id="selector-escenario">
            <option value="NIVEL_ALERTA4">Escenario 1 (Base)</option>
            <option value="NIVEL_ALERTA2">Escenario 2 (Prueba A)</option>
            <option value="NIVEL_ALERTA3">Escenario 3 (Prueba B)</option>
            <option value="NIVEL_ALERTA1">Escenario 4 (Prueba C)</option>
            
        </select>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-vector@4.1.0/dist/esri-leaflet-vector.js"></script>
    
    <script>
        var map = L.map('map').setView([19.32, -99.65], 9);
        const llaveEsri = "AAPTa8q9jVjx5yp9dWDmt4yON9Q..LuVerHfjba0cWJIHGg_nNNACso7kRNpVFovApP9NrQOMagkhYy8Z2arUVa-3l4q9uLEotqfSEEdoMCyrK_7iyEV_UUoIuwjFO2-XDNOuM8q9vw7XfSjhTokEYEQwFCONc_PFS3fImFwbFvAHAot4eZQJATJNCGowJeVor5AxCxUyZnwDz463W74IpQ5OTFRvraU58a7NEOZc_p6CSrVxW4AmXhQ0jqKonEpdGQ1nvUa-cBdSUbSHG4I.AT1_FDeLxvxn";

        L.esri.Vector.vectorBasemapLayer("ArcGIS:ChartedTerritory", {
            apikey: llaveEsri,
            pane: 'tilePane' 
        }).addTo(map);

        function getColor(nivel) {
            if (!nivel) return '#CCCCCC';
            let n = String(nivel).trim().toLowerCase();
            
            return n === 'prioritario' ? '#800026' :
                   n === 'alto'        ? '#E31A1C' :
                   n === 'medio'       ? '#FD8D3C' :
                   n === 'bajo'        ? '#FED976' :
                                         '#CCCCCC'; 
        }

        const municipiosDestacados = [
            '15082', '15123', '15008', '15105', '15080', '15097', '15086', '15066'
        ];

        let escenarioActual = 'NIVEL_ALERTA1';

        function styleCoropleta(feature) {
            let props = feature.properties || {}; 
            
            // Forzamos la lectura directa de CVE_MUN y lo convertimos a texto limpio
            let cve = String(props.cve_inegi).trim();
            let esDestacado = municipiosDestacados.includes(cve);
            
            let nivel = props[escenarioActual] || props['NIVEL_ALERTA'] || props['nivel_alerta'] || 'N/D';

            return {
                fillColor: getColor(nivel),
                weight: esDestacado ? 3.5 : 1, // Borde más grueso para los destacados
                opacity: 1,
                color: esDestacado ? '#ff0000' : '#ffffff', // Rojo puro vs Blanco
                fillOpacity: 0.75
            };
        }

        let capaRiesgo; 

        // Actualizado a municipios_riesgo2.geojson
        fetch('municipios_riesgo2.geojson')
            .then(response => {
                if (!response.ok) throw new Error("No se pudo leer el GeoJSON.");
                return response.json();
            })
            .then(data => {
                
                // CAPA 1
                capaRiesgo = L.geoJson(data, {
                    style: styleCoropleta,
                    onEachFeature: function (feature, layer) {
                        
                        let props = feature.properties || {};
                        let cve = String(props.CVE_MUN).trim();
                        let esDestacado = municipiosDestacados.includes(cve);

                        // TRUCO: Mandar los bordes rojos al frente para que no los tapen los bordes blancos
                        if (esDestacado) {
                            layer.on('add', function () {
                                layer.bringToFront();
                            });
                        }

                        // Popup
                        layer.on('click', function(e) {
                            var nivel = props[escenarioActual] || props['NIVEL_ALERTA'] || props['nivel_alerta'] || 'Sin Datos';
                            var nombre = props.NOM_MUN || props.nom_mun || props.Nom_Mun || 'Municipio Desconocido';
                            
                            var contenido = "<div style='text-align:center;'>" +
                                "<h3 style='margin:0 0 5px 0; color:#333;'>" + nombre + "</h3>" +
                                "Nivel de Alerta: <b>" + nivel + "</b><br>" +
                                "</div>";
                            
                            layer.bindPopup(contenido).openPopup();
                        });
                    }
                }).addTo(map);

                // CAPA 2
                var capaCasos = L.layerGroup().addTo(map);
                
                capaRiesgo.eachLayer(function(layer) {
                    let props = layer.feature.properties || {};
                    var casos = props.CASOS_REALES_DESPLAZAMIENTO || props.casos_reales_desplazamiento || props.Casos_Reales_Desplazamiento || 0;
                    
                    if (casos > 0) {
                        var centroide = layer.getBounds().getCenter();
                        var nombre = props.NOM_MUN || props.nom_mun || props.Nom_Mun || 'Municipio';
                        
                        var circulo = L.circleMarker(centroide, {
                            radius: 6,
                            fillColor: "#0055ff",
                            color: "#ffffff", 
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).bindPopup(
                            "<div style='text-align:center;'>" +
                            "<b>" + nombre + "</b><br>" +
                            "<span style='font-size:14px; color:#0055ff;'><b>" + casos + "</b> Reportes vinculados a desplazamientos</span>" +
                            "</div>"
                        );
                        capaCasos.addLayer(circulo);
                    }
                });

                var controles = {
                    "🔴 Polígonos de Riesgo": capaRiesgo,
                    "🔵 Reportes vinculados a desplazamientos": capaCasos
                };
                L.control.layers(null, controles, {collapsed: false}).addTo(map);
            })
            .catch(error => console.error("Error crítico: ", error));

        document.getElementById('selector-escenario').addEventListener('change', function(e) {
            escenarioActual = e.target.value; 
            if (capaRiesgo) {
                capaRiesgo.setStyle(styleCoropleta);
                
                // Volver a mandar al frente los polígonos rojos al cambiar de escenario
                capaRiesgo.eachLayer(function(layer) {
                    let props = layer.feature.properties || {};
                    let cve = String(props.CVE_MUN).trim();
                    if (municipiosDestacados.includes(cve)) {
                        layer.bringToFront();
                    }
                });
                
                map.closePopup(); 
            }
        });

        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'leyenda'),
                niveles = ['Prioritario', 'Alto', 'Medio', 'Bajo']; 
            
            div.innerHTML = '<h4>Riesgo Predictivo</h4>';
            for (var i = 0; i < niveles.length; i++) {
                div.innerHTML += '<i style="background:' + getColor(niveles[i]) + '"></i> ' + niveles[i] + '<br>';
            }
            div.innerHTML += '<hr style="margin:10px 0; border:0; border-top:1px solid #ccc;">';
            div.innerHTML += '<i style="background:#0055ff; border-radius:50%; height:14px; width:14px; margin-top:2px;"></i> Reportes vinculados a desplazamientos';
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
